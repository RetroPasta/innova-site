const MUN=['Adjuntas','Aguada','Aguadilla','Aguas Buenas','Aibonito','Añasco','Arecibo','Arroyo','Barceloneta','Barranquitas','Bayamón','Cabo Rojo','Caguas','Camuy','Canóvanas','Carolina','Cataño','Cayey','Ceiba','Ciales','Cidra','Coamo','Comerío','Corozal','Culebra','Dorado','Fajardo','Florida','Guánica','Guayama','Guayanilla','Guaynabo','Gurabo','Hatillo','Hormigueros','Humacao','Isabela','Jayuya','Juana Díaz','Juncos','Lajas','Lares','Las Marías','Las Piedras','Loíza','Luquillo','Manatí','Maricao','Maunabo','Mayagüez','Moca','Morovis','Naguabo','Naranjito','Orocovis','Patillas','Peñuelas','Ponce','Quebradillas','Rincón','Río Grande','Sabana Grande','Salinas','San Germán','San Juan','San Lorenzo','San Sebastián','Santa Isabel','Toa Alta','Toa Baja','Trujillo Alto','Utuado','Vega Alta','Vega Baja','Vieques','Villalba','Yabucoa','Yauco'];
let L='es',Q=JSON.parse(localStorage.getItem('innovaQ')||'[]'),curCat='inc',curP=null,selS=null,selK=null;
const t=o=>o[L];

const KW={'INC-BR-001':'diaper diapers panal panales pull up adulto','INC-UP-002':'chux pad bed pad underpads empapador protector cama','INC-WW-003':'toallitas wipes humedas','INC-WC-004':'paños washcloth toallas','PPE-NG-010':'guantes gloves latex free exam','PPE-IG-011':'gown bata isolation proteccion ppe','WND-GZ-020':'gasa gauze curita','WND-SP-021':'esponja gasa sponge','WND-FD-022':'ulcera ulcer bedsore llaga escara apósito dressing foam','WND-OS-023':'colostomia colostomy bolsa pouch','MOB-WC-030':'silla wheelchair ruedas','MOB-WC-031':'silla wheelchair liviana ruedas','BTH-SC-040':'ducha shower bano bath','BTH-TB-041':'banco ducha bench tub bano','EXM-TB-050':'camilla table examen','EXM-PP-051':'papel crepe paper roll','DGN-ST-060':'estetoscopio stethoscope','DGN-BP-061':'presion blood pressure bp cuff esfigmomanometro tensiometro','SCL-DF-070':'balanza bascula scale peso weight','SCL-CL-071':'balanza bascula scale peso weight pedestal'};
const nrm=x=>(x||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let SH=[],SI=-1;
function srch(){const q=nrm(sq.value).trim();if(!q){sres.classList.remove('on');return}
const terms=q.split(/\s+/);SH=[];CATS.forEach(c=>c.p.forEach((p,i)=>{const hay=nrm([p.es,p.en,p.sku,c.es,c.en,KW[p.sku]||'',c.d?c.d.es:'',c.d?c.d.en:'',...p.s,...p.k].join(' '));if(terms.every(w=>hay.includes(w)))SH.push([c,p,i])}));SI=-1;
sres.innerHTML=SH.length?SH.slice(0,12).map(([c,p,i],n)=>`<a href="#" data-n="${n}" onmousedown="event.preventDefault();spick(${n})"><img src="img/${p.sku}.jpg" alt=""><span><b>${t(p)}</b><small>${t(c)} · ${p.sku}</small></span></a>`).join(''):`<div class="none">${L==='es'?'No encontramos productos. Escríbalo en Notas de su cotización y lo buscamos.':'No products found. Add it to your quote Notes and we will source it.'}</div>`;sres.classList.add('on')}
function spick(n){const [c,p,i]=SH[n];sres.classList.remove('on');sq.value='';sq.blur();showP(c.id,i)}
function skey(e){const a=[...sres.querySelectorAll('a')];if(e.key==='Escape'){sres.classList.remove('on');sq.blur();return}
if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!a.length)return;SI=(SI+(e.key==='ArrowDown'?1:-1)+a.length)%a.length;a.forEach((x,k)=>x.classList.toggle('hl',k===SI));a[SI].scrollIntoView({block:'nearest'})}
if(e.key==='Enter'&&SH.length)spick(SI<0?0:SI)}
sq.addEventListener('blur',()=>setTimeout(()=>sres.classList.remove('on'),150));
function setLang(l){L=l;sq.placeholder=l==="es"?"Buscar productos, tamaño o SKU…":"Search products, size, or SKU…";document.documentElement.lang=l;bes.className=l==='es'?'on':'';ben.className=l==='en'?'on':'';document.querySelectorAll('[data-es]').forEach(e=>e.textContent=e.dataset[l]);render()}
function go(v,anchor){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');if(v==='cat')showCat(curCat);if(anchor)setTimeout(()=>document.getElementById(anchor).scrollIntoView(),0);else scrollTo(0,0);render();return false}
function im(sku,alt){return `<img src="img/${sku}.jpg" alt="${alt||''}" loading="lazy">`}
function ph(i,label){return `<b>${i}</b>${label||(L==='es'?'Foto próximamente':'Photo coming soon')}`}
function showCat(id){curCat=id;const c=CATS.find(x=>x.id===id);catTitle.textContent=t(c);catSel.innerHTML=CATS.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${t(x)}</option>`).join('');
plist.innerHTML=c.p.map((p,i)=>`<div class="prod"><div class="ph im" style="cursor:pointer" onclick="showP('${id}',${i})">${im(p.sku,t(p))}</div><div class="b"><h4 style="cursor:pointer" onclick="showP('${id}',${i})">${t(p)}</h4><div class="meta">SKU ${p.sku} · ${L==='es'?'Marca al cotizar':'Brand on quote'}</div><div class="price">${L==='es'?'Precio por cotización':'Price on quote'}</div><div class="row"><select id="s${i}">${p.s.map(s=>`<option>${s}</option>`).join('')}</select><input class="qty" type="number" id="q${i}" value="10"><button class="btn t" style="padding:9px 12px" onclick="add('${id}',${i},s${i}.value,'${p.k[0]}',+q${i}.value)">+</button></div></div></div>`).join('')}
function showP(c,i){curCat=c;curP=i;const C=CATS.find(x=>x.id===c),p=C.p[i];selS=p.s[0];selK=p.k[0];go('product')}
function renderP(){if(curP===null)return;const C=CATS.find(x=>x.id===curCat),p=C.p[curP];pcrumb.textContent=(L==='es'?'Inicio › Catálogo › ':'Home › Catalog › ')+t(C);pimg.className='ph im';pimg.innerHTML=im(p.sku,t(p));pname.textContent=t(p);pmeta.textContent=`SKU ${p.sku} · ${L==='es'?'Marca al cotizar':'Brand on quote'}`;
pdesc.textContent=L==='es'?'Elija tamaño, empaque y cantidad, y añádalo a su cotización. Le confirmamos marca, especificaciones y precio por volumen al cotizar.':'Pick a size, pack, and quantity, and add it to your quote. We confirm brand, specs, and volume pricing with your quote.';
psizes.innerHTML=p.s.map(s=>`<span class="chip ${s===selS?'on':''}" onclick="selS='${s}';renderP()">${s}</span>`).join('');ppacks.innerHTML=p.k.map(k=>`<span class="chip ${k===selK?'on':''}" onclick="selK='${k}';renderP()">${k}</span>`).join('')}
function addFromPD(){add(curCat,curP,selS,selK,+pqty.value)}
function add(c,p,s,k,q){if(!(q>0))q=1;Q.push({c,p,s,k,q});save();render();const b=document.querySelector('.qbtn');b.style.transform='scale(1.1)';setTimeout(()=>b.style.transform='',200)}
function save(){localStorage.setItem('innovaQ',JSON.stringify(Q))}
function render(){qc.textContent=Q.length;cats.innerHTML=CATS.map(c=>`<div class="cat" onclick="curCat='${c.id}';go('cat')"><div class="ph im">${im(c.p[0].sku,t(c))}</div><div class="n">${t(c)}<small>${L==='es'?c.ses:c.sen}</small></div></div>`).join('');
qrows.innerHTML=Q.map((r,i)=>{const p=CATS.find(x=>x.id===r.c).p[r.p];return `<tr><td>${t(p)}<br><small style="color:#5b6b7a">${p.sku}</small></td><td>${r.s} · ${r.k}</td><td><input class="qty" type="number" value="${r.q}" onchange="Q[${i}].q=Math.max(1,+this.value);save()"></td><td><a href="#" onclick="Q.splice(${i},1);save();render();return false" style="color:#c0392b">✕</a></td></tr>`}).join('')||`<tr><td colspan="4" class="empty">${L==='es'?'Su lista está vacía. Añada productos desde el catálogo, o describa lo que necesita en Notas.':'Your list is empty. Add products from the catalog, or describe what you need in Notes.'}</td></tr>`;
const fi=ftype.selectedIndex,qi=freq.selectedIndex,mi=muni.selectedIndex;ftype.innerHTML=FT[L].map(x=>`<option>${x}</option>`).join('');freq.innerHTML=FQ[L].map(x=>`<option>${x}</option>`).join('');muni.innerHTML=`<option value="">${L==='es'?'Seleccione…':'Select…'}</option>`+MUN.map(x=>`<option>${x}</option>`).join('');if(fi>0)ftype.selectedIndex=fi;if(qi>0)freq.selectedIndex=qi;if(mi>0)muni.selectedIndex=mi;
if(document.getElementById('cat').classList.contains('on'))showCat(curCat);renderP()}

function sendQuote(){const v=id=>document.getElementById(id).value.trim();const es=L==='es';
if(!v('fname')||!v('contact')||!v('phone')||!muni.value){qerr.textContent=es?'Complete nombre de la facilidad, persona de contacto, teléfono y municipio.':'Please fill in facility name, contact person, phone, and municipality.';qerr.style.display='block';return}
if(!Q.length&&!v('notes')){qerr.textContent=es?'Añada al menos un producto o describa lo que necesita en Notas.':'Add at least one product or describe what you need in Notes.';qerr.style.display='block';return}
qerr.style.display='none';qok.style.display='none';
const lines=Q.map((r,i)=>{const C=CATS.find(x=>x.id===r.c),p=C.p[r.p];return `${i+1}. ${p.es} / ${p.en} (SKU ${p.sku}) - ${r.s}, ${r.k} - Cant./Qty: ${r.q}`});
const body=[es?'Solicitud de cotización - Innova Supply':'Quote request - Innova Supply','',
`Facilidad / Facility: ${v('fname')}`,`Tipo / Type: ${FT.es[ftype.selectedIndex]}`,`Municipio: ${muni.value}`,`Contacto / Contact: ${v('contact')}`,`Teléfono / Phone: ${v('phone')}`,`Email: ${v('email')||'-'}`,`Frecuencia / Frequency: ${FQ.es[freq.selectedIndex]}`,'',
'Productos / Products:',...(lines.length?lines:['-']),'',`Notas / Notes: ${v('notes')||'-'}`].join('\n');
const subj=`Solicitud de cotización / Quote request - ${v('fname')}`;
const mail=()=>location.href=`mailto:innova_pr1@yahoo.com?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
const em=v('email'),payload={_subject:subj,Facilidad:v('fname'),Tipo:FT.es[ftype.selectedIndex],Municipio:muni.value,Contacto:v('contact'),Telefono:v('phone'),Correo:em||'-',Frecuencia:FQ.es[freq.selectedIndex],Productos:(lines.length?lines:['-']).join('\n'),Notas:v('notes')||'-',Idioma:L,message:body};
if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))payload.email=em;
qsend.disabled=true;qsend.textContent=es?'Enviando…':'Sending…';
fetch('https://formspree.io/f/xwloqjjw',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)})
.then(r=>{if(!r.ok)throw 0;Q=[];save();render();['fname','contact','phone','email','notes'].forEach(id=>document.getElementById(id).value='');
qok.textContent=es?'¡Gracias! Recibimos su solicitud y le enviaremos su cotización en 1 día laborable.':'Thank you! We received your request and will send your quote within 1 business day.';qok.style.display='block';qok.scrollIntoView({block:'center'})})
.catch(()=>{qerr.textContent=es?'No pudimos enviar en este momento. Llámenos al 787-638-4220 o envíe por correo (se abrirá su aplicación de correo).':'We could not send right now. Call us at 787-638-4220 or send by email (your email app will open).';qerr.style.display='block';setTimeout(mail,1500)})
.finally(()=>{qsend.disabled=false;qsend.textContent=qsend.dataset[L]})}
const P=new URLSearchParams(location.search);setLang(P.get('lang')||'es');if(P.get('view')==='product')showP('inc',0);else if(P.get('view'))go(P.get('view'));
</script></body></html>
