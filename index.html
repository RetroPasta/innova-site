pdesc.textContent=L==='es'?'Elija tamaño, empaque y cantidad, y añádalo a su cotización. Le confirmamos marca, especificaciones y precio por volumen al cotizar.':'Pick a size, pack, and quantity, and add it to your quote. We confirm brand, specs, and volume pricing with your quote.';
psizes.innerHTML=S(p).map((s,n)=>`<span class="chip ${n===selS?'on':''}" onclick="selS=${n};renderP()">${s}</span>`).join('');ppacks.innerHTML=K(p).map((k,n)=>`<span class="chip ${n===selK?'on':''}" onclick="selK=${n};renderP()">${k}</span>`).join('')}
function addFromPD(){const p=CATS.find(x=>x.id===curCat).p[curP];add(curCat,curP,S(p)[selS],K(p)[selK],+pqty.value)}
function add(c,p,s,k,q){if(!(q>0))q=1;Q.push({c,p,s,k,q});save();render();const b=document.querySelector('.qbtn');b.style.transform='scale(1.1)';setTimeout(()=>b.style.transform='',200)}
function save(){localStorage.setItem('innovaQ',JSON.stringify(Q))}
function render(){qc.textContent=Q.length;cats.innerHTML=CATS.map(c=>`<div class="cat" onclick="curCat='${c.id}';go('cat')"><div class="ph im">${im(c.p[0].sku,t(c))}</div><div class="n">${t(c)}<small>${L==='es'?c.ses:c.sen}</small></div></div>`).join('');
qrows.innerHTML=Q.map((r,i)=>{const p=CATS.find(x=>x.id===r.c).p[r.p];return `<tr><td>${t(p)}<br><small style="color:#5b6b7a">${p.sku}</small></td><td>${r.s} · ${r.k}</td><td><input class="qty" type="number" value="${r.q}" onchange="Q[${i}].q=Math.max(1,+this.value);save()"></td><td><a href="#" onclick="Q.splice(${i},1);save();render();return false" style="color:#c0392b">✕</a></td></tr>`}).join('')||`<tr><td colspan="4" class="empty">${L==='es'?'Su lista está vacía. Añada productos desde el catálogo, o describa lo que necesita en Notas.':'Your list is empty. Add products from the catalog, or describe what you need in Notes.'}</td></tr>`;
const fi=ftype.selectedIndex,qi=freq.selectedIndex,mi=muni.selectedIndex;ftype.innerHTML=FT[L].map(x=>`<option>${x}</option>`).join('');freq.innerHTML=FQ[L].map(x=>`<option>${x}</option>`).join('');muni.innerHTML=`<option value="">${L==='es'?'Seleccione…':'Select…'}</option>`+MUN.map(x=>`<option>${x}</option>`).join('');if(fi>0)ftype.selectedIndex=fi;if(qi>0)freq.selectedIndex=qi;if(mi>0)muni.selectedIndex=mi;
if(document.getElementById('cat').classList.contains('on'))showCat(curCat);renderP()}

function sendQuote(){const v=id=>document.getElementById(id).value.trim();const es=L==='es';
if(!v('fname')||!v('contact')||!v('phone')||!muni.value){qerr.textContent=es?'Complete nombre de la facilidad, persona de contacto, teléfono y municipio.':'Please fill in facility name, contact person, phone, and municipality.';qerr.style.display='block';return}
if(!Q.length&&!v('notes')){qerr.textContent=es?'Añada al menos un producto o describa lo que necesita en Notas.':'Add at least one product or describe what you need in Notes.';qerr.style.display='block';return}
qerr.style.display='none';qok.style.display='none';
const lines=Q.map((r,i)=>{const C=CATS.find(x=>x.id===r.c),p=C.p[r.p];return `${i+1}. ${p.es} / ${p.en} (SKU ${p.sku}) - ${r.s}, ${r.k} - Cant./Qty: ${r.q}`});
const body=[es?'Solicitud de cotización - Innova Supply':'Quote request - Innova Supply','',
`Facilidad / Facility: ${v('fname')}`,`Tipo / Type: ${FT.es[ftype.selectedIndex]}`,`Municipio: ${muni.value}`,`Contacto / Contact: ${v('contact')}`,`Teléfono / Phone: ${v('phone')}`,`Email: ${v('email')||'-'}`,`Frecuencia / Frequency: ${FQ.es[freq.selectedIndex]}`,'',
'Productos / Products:',...(lines.length?lines:['-']),'',`Notas / Notes: ${v('notes')||'-'}`].join('\n');
const subj=`Solicitud de cotización / Quote request - ${v('fname')}`;
const mail=()=>location.href=`mailto:innova_pr1@yahoo.com?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
const em=v('email'),payload={_subject:subj,Facilidad:v('fname'),Tipo:FT.es[ftype.selectedIndex],Municipio:muni.value,Contacto:v('contact'),Telefono:v('phone'),Correo:em||'-',Frecuencia:FQ.es[freq.selectedIndex],Productos:(lines.length?lines:['-']).join('\n'),Notas:v('notes')||'-',Idioma:L,message:body};
if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))payload.email=em;
qsend.disabled=true;qsend.textContent=es?'Enviando…':'Sending…';
fetch('https://formspree.io/f/xwloqjjw',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)})
.then(r=>{if(!r.ok)throw 0;Q=[];save();render();['fname','contact','phone','email','notes'].forEach(id=>document.getElementById(id).value='');
qok.textContent=es?'¡Gracias! Recibimos su solicitud y le enviaremos su cotización en 1 día laborable.':'Thank you! We received your request and will send your quote within 1 business day.';qok.style.display='block';qok.scrollIntoView({block:'center'})})
.catch(()=>{qerr.textContent=es?'No pudimos enviar en este momento. Llámenos al 787-638-4220 o envíe por correo (se abrirá su aplicación de correo).':'We could not send right now. Call us at 787-638-4220 or send by email (your email app will open).';qerr.style.display='block';setTimeout(mail,1500)})
.finally(()=>{qsend.disabled=false;qsend.textContent=qsend.dataset[L]})}
const P=new URLSearchParams(location.search);setLang(P.get('lang')||'es');if(P.get('view')==='product')showP('inc',0);else if(P.get('view'))go(P.get('view'));
